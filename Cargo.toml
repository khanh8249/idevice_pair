[package]
name = "idevice_pair"
version = "1.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
idevice = { version = "0.1.68", features = [
    "afc",
    "core_device_proxy",
    "house_arrest",
    "installation_proxy",
    "mdns",
    "pair",
    "remote_pairing",
    "rsd",
    "tcp",
    "tunnel_tcp_stack",
    "usbmuxd",
] }

tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "signal",
] }

futures-util = "0.3.33"
mdns-sd = "0.20"
uuid = { version = "1.24", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[patch.crates-io]
idevice = { git = "https://github.com/khanh8249/idevice", branch = "master", package = "idevice" }
