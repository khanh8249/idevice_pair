name: Build Android ARMv7

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.3.13750724"
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version
          cargo ndk --version
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Build ARMv7 Android
        run: |
          cargo ndk \
            -t armeabi-v7a \
            --platform 24 \
            build --release

      - name: Prepare artifact
        run: |
          mkdir -p dist

          cp \
            target/armv7-linux-androideabi/release/idevice-pair \
            dist/idevice-pair-armv7-android

          chmod +x dist/idevice-pair-armv7-android

          file dist/idevice-pair-armv7-android

      - name: Upload ARMv7 binary
        uses: actions/upload-artifact@v4
        with:
          name: idevice-pair-armv7-android
          path: dist/idevice-pair-armv7-android
          if-no-files-found: error
