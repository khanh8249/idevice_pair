name: Build Android ARMv7

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: 25.2.9519653

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Cache Rust toolchain ----------
      - name: Cache Rust Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cargo/bin/
            ~/.rustup/
            target/
          key: rust-cargo-${{ runner.os }}-armv7-${{ hashFiles('**/Cargo.lock') }}
aml          restore-keys: |
            rust-cargo-${{ runner.os }}-armv7-

      # ---------- Cài đặt Rust ----------
     
 - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets     : armv7-linux-androideabi

      # ---------- Cài đặt NDK ----------
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Export NDK env
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # ---------- Cài cargo-ndk ----------
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ---------- Build ----------
      - name: Build for ARMv7
        run: cargo ndk -t armeabi-v7a -o ./jniLibs build --release

      # ---------- Upload artifact ----------
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: android-armv7-binary
          path: |
            target/armv7-linux-androideabi/release/
            jniLibs/armeabi-v7a/
          if-no-files-found: error
