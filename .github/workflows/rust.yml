name: Build Android ARMv7

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: "27.3.13750724"
      ANDROID_API: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "ndk;${NDK_VERSION}"

      - name: Verify Android toolchain
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          sdkmanager --list_installed | grep -E "platform-tools|platforms;android-${ANDROID_API}|ndk;${NDK_VERSION}" || true

          ls -la "$ANDROID_HOME/ndk/${NDK_VERSION}"

      - name: Install cargo-ndk
        shell: bash
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build ARMv7
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -p ${ANDROID_API} \
            build \
            --release

      - name: Show binary
        shell: bash
        run: |
          find target -type f -executable -print || true
          file target/armv7-linux-androideabi/release/idevice_pair || true

      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          cp \
            target/armv7-linux-androideabi/release/idevice_pair \
            dist/idevice_pair-armv7

          chmod +x dist/idevice_pair-armv7

          tar -czf \
            dist/idevice_pair-android-armv7.tar.gz \
            -C dist \
            idevice_pair-armv7

      - name: Upload ARMv7 binary
        uses: actions/upload-artifact@v4
        with:
          name: idevice_pair-android-armv7
          path: dist/idevice_pair-android-armv7.tar.gz
