name: Build Android ARMv7

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Android ARMv7
    runs-on: ubuntu-24.04

    env:
      CARGO_TERM_COLOR: always
      NDK_VERSION: r27d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: armv7-linux-androideabi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            pkg-config \
            libssl-dev

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Build ARMv7
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -p 24 \
            build \
            --release

      - name: Show binary
        run: |
          file target/armv7-linux-androideabi/release/idevice_pair || true
          ls -lh target/armv7-linux-androideabi/release/

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          cp target/armv7-linux-androideabi/release/idevice_pair \
            artifact/idevice_pair-armv7-android

          chmod +x artifact/idevice_pair-armv7-android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: idevice-pair-android-armv7
          path: artifact/idevice_pair-armv7-android
          if-no-files-found: error
