name: Build Android ARMv7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-armv7-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-armv7-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.7 --locked

      - name: Install build tools for aws-lc-sys
        run: sudo apt-get update && sudo apt-get install -y cmake nasm

      - name: Sanitize environment
        run: |
          unset CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER
          unset CARGO_NDK_OUTPUT_PATH
          unset CARGO_NDK_CMAKE_TOOLCHAIN_PATH
          env | grep -E 'NDK|CARGO' | sed 's/=.*/=<set>/' || true

      - name: Build ARMv7
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK }}
        run: cargo ndk -t armeabi-v7a -o ./jniLibs --link-builtins build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-armv7-binary
          path: jniLibs/armeabi-v7a/
          if-no-files-found: error
