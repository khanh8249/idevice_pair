name: Build Android ARMv7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NDK_PLATFORM: 24

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-armv7-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-armv7-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure Android toolchain
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

          echo "NDK_PATH=${{ steps.ndk.outputs.ndk-path }}"

          ls -la "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" | head

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build ARMv7
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -p 24 \
            build --release

      - name: Strip binary
        run: |
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            target/armv7-linux-androideabi/release/idevice_pair

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/armv7-linux-androideabi/release/idevice_pair dist/
          file dist/idevice_pair

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: idevice-pair-android-armv7
          path: dist/idevice_pair
          if-no-files-found: error
