name: Build Android ARMv7

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-armv7-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-armv7-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Configure Android linker
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "RUSTFLAGS=-C link-arg=-landroid-support" >> "$GITHUB_ENV"

          echo "NDK: $NDK"
          echo "Toolchain: $TOOLCHAIN"

      - name: Verify Android toolchain
        run: |
          rustc --version
          cargo --version
          cargo ndk --version
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Build ARMv7
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -o ./jniLibs \
            build \
            --release

      - name: Verify binary
        run: |
          find jniLibs -type f -maxdepth 3 -print
          file jniLibs/armeabi-v7a/*

      - name: Upload ARMv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: idevice-pair-android-armv7
          path: jniLibs/armeabi-v7a/
          if-no-files-found: error
