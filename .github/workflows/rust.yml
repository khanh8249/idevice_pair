name: Build Android ARMv7

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Android ARMv7
    runs-on: ubuntu-24.04

    env:
      CARGO_TERM_COLOR: always
      NDK_VERSION: 27.3.13750724

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: armv7-linux-androideabi

      - name: Locate Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            echo "sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -name sdkmanager -type f -print
            exit 1
          fi

      - name: Accept Android licenses
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install Android NDK
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;${NDK_VERSION}"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Build ARMv7
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -p 24 \
            build \
            --release

      - name: Verify binary
        run: |
          BIN="target/armv7-linux-androideabi/release/idevice_pair"

          if [ ! -f "$BIN" ]; then
            echo "Binary not found:"
            find target -type f -perm -111 -print
            exit 1
          fi

          file "$BIN"
          ls -lh "$BIN"

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          cp \
            target/armv7-linux-androideabi/release/idevice_pair \
            artifact/idevice_pair-armv7-android

          chmod +x artifact/idevice_pair-armv7-android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: idevice-pair-android-armv7
          path: artifact/idevice_pair-armv7-android
          if-no-files-found: error
