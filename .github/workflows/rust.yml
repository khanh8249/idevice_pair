name: Build Android ARMv7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-armv7-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-armv7-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.0.3 --locked

      - name: Install build tools for aws-lc-sys
        run: sudo apt-get update && sudo apt-get install -y cmake nasm

      - name: Build ARMv7
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t armeabi-v7a -o ./jniLibs --link-builtins build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-armv7-binary
          path: jniLibs/armeabi-v7a/
          if-no-files-found: error
